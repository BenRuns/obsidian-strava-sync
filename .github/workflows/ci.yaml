name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: 🛠️ Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile
      - name: ☢️ Biome
        run: yarn biome ci
      # The same rules Obsidian's release review runs (see eslint.config.mjs).
      # Fails on any warning, so a PR can't add one.
      - name: 🔎 Obsidian lint
        run: yarn lint:obsidian
      - name: 🧪 Test
        run: yarn test
      - name: 🔨 Build
        run: yarn build
      - name: 🚀 Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            main.js
            manifest.json
            styles.css
